<!DOCTYPE html>
<html>
<head>
<title>Hasini</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;margin:0}
body{
  font-family:Arial;text-align:center;color:white;
  min-height:100vh;padding:80px 20px;
  background:linear-gradient(135deg,#6a11cb,#2575fc,#ff4ecd);
  background-size:300% 300%;
  animation:bg 6s infinite alternate;
}
@keyframes bg{to{background-position:100% 100%}}

h1{font-size:60px;margin:30px;
   animation:glow 2s infinite alternate}
@keyframes glow{
  from{text-shadow:0 0 10px #fff}
  to{text-shadow:0 0 30px #00ffff}
}
p{font-size:20px;margin:20px}
button{
  padding:14px 30px;border:0;border-radius:30px;
  background:#fff;color:#6a11cb;font-weight:bold;
  cursor:pointer;
}
button:hover{transform:scale(1.1)}

@media(max-width:600px){
  h1{font-size:42px}
  p{font-size:17px}
}
</style>
</head>

<body>

<h1>Hi, I'm Hasini 💜</h1>

<p>Welcome to my colourful website ✨</p>

<p>I love learning, creativity & technology 🚀</p>

<button>Explore More 🌸</button>

</body>
</html>
